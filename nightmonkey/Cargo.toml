[package]
name = "nightmonkey"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true

[features]
default = ["ff147"]
# Engine version (see compiler/src/opcodes/): exactly one.
ff147 = ["night-compiler/ff147", "night-snapshot/ff147"]
wizen = ["dep:wizer", "dep:libc"]

[dependencies]
night-compiler = { path = "../compiler", default-features = false }
night-snapshot = { path = "../snapshot", default-features = false }
waffle = { version = "0.3.1", features = ["parallel"] }
anyhow = "1"
wizer = { version = "9", optional = true }
libc = { version = "0.2", optional = true }

[[bin]]
name = "nightmonkey"
path = "src/main.rs"
